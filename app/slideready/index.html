<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Readability</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2TEDJBT1YX"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-2TEDJBT1YX');</script>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: calm work tool. Light theme only (VJ rule). One accent (cobalt); amber, red, green are status only.
   Radius rule: 8px for every surface and control, 2px for slide previews. Cards only where a choice is being made. */
:root{
  --surface:#f6f7f9; --panel:#ffffff; --sunk:#eceef2; --ink:#151a22; --muted:#5b6472; --faint:#8b93a1; --line:#e3e6eb;
  --accent:#2346c8; --accent-soft:#eef1fc;
  --high:#c8372d; --some:#b7791f; --good:#2f8a57;
  --r:8px;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
h1{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:0}
button:active,.ant-btn:active{transform:translateY(1px)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;font:inherit;color:var(--muted);padding:16px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:var(--r)}

/* results header */
.result-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px 48px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.result-head{grid-template-columns:1fr}}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font:600 64px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score span{font-size:16px;color:var(--faint)}
.band{font-size:18px;font-weight:600;margin-top:4px}
.context{margin-top:8px;color:var(--muted);max-width:60ch}
.context a{color:var(--accent);cursor:pointer;margin-left:4px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat b{font:600 28px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.cat span{font-size:13px;color:var(--muted)}
.fixbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}

/* workspace */
.thumbs{display:flex;flex-direction:column;gap:14px}
@media (max-width:991px){.thumbs{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.thumb{cursor:pointer;display:flex;flex-direction:column;gap:6px;flex:none;border-radius:var(--r);padding:4px;outline:2px solid transparent}
.thumb:hover{background:var(--sunk)}
.thumb.on{outline-color:var(--accent);background:var(--panel)}
.thumb:focus-visible{outline-color:var(--accent)}
.thumb .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);gap:6px}
.thumb .meta b{font:600 13px var(--mono)}
.stagebox{background:var(--sunk);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stagebox .cap{font-size:13px;color:var(--muted);text-align:center;max-width:62ch}
.views{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.seat{display:flex;align-items:center;gap:12px;width:100%;max-width:520px}
.seat .ant-slider{flex:1}

/* slide rendering */
.slide{position:relative;overflow:hidden;border-radius:2px;box-shadow:0 1px 2px rgba(21,26,34,.12),0 4px 16px rgba(21,26,34,.06);font-family:"Geist",system-ui,sans-serif;flex:none}
.slide .el{position:absolute;line-height:1.2;white-space:pre-wrap}
.slide .el ul{margin:0;padding-left:1.1em;line-height:1.35}
.slide .el p{margin:0;line-height:1.35}
.slide .el.hl{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.slide .labels{display:flex;justify-content:space-between;height:100%}
.slide .bars{display:flex;align-items:flex-end;gap:6%;height:100%;padding:0 2%}
.slide .bars i{display:block;flex:1;border-radius:2px 2px 0 0}
.slide svg.qr{width:100%;height:100%;display:block}
.heads{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.heads .line{position:absolute;left:0;right:0;top:0;border-top:2px dashed var(--some)}
.heads .line span{position:absolute;right:6px;top:4px;font:500 11px var(--sans);color:#fff;background:var(--some);padding:1px 6px;border-radius:4px}
.captions{position:absolute;left:0;right:0;bottom:0;height:15%;background:rgba(10,12,16,.8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;text-align:center;padding:0 4%}
.pip{position:absolute;right:2%;bottom:3%;width:24%;height:24%;background:#2c3340;border:2px solid #fff;border-radius:4px;color:#d9dce3;display:flex;align-items:center;justify-content:center;font:500 11px var(--sans)}

/* review layout */
.review{display:flex;flex-direction:column;gap:28px;padding-top:28px}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 48px;align-items:end}
@media (max-width:900px){.rhead{grid-template-columns:1fr}}
.rhead h1{font-size:30px;line-height:1.15;max-width:24ch}
.rscore{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (max-width:900px){.rscore{align-items:flex-start}}
.rscore .score{display:flex;align-items:baseline;gap:6px}
.rscore .score b{font:600 40px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rscore .score span{color:var(--faint)}
.catline{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.catline b{font-family:var(--mono);font-weight:600}
.seatmap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.sm-screen{font-size:12px;color:var(--muted);writing-mode:horizontal-tb;padding:6px 8px;border-left:3px solid var(--ink)}
.sm-rows{display:flex;gap:2px;height:36px}
.sm-row{flex:1;min-width:3px;border:0;padding:0;border-radius:2px;cursor:pointer;transition:transform 120ms ease-out}
.sm-row.good{background:#bfe0cc}.sm-row.some{background:#efd29a}.sm-row.high{background:#eeb3ad}
.sm-row:hover{transform:scaleY(1.12)}
.sm-row.you{outline:2px solid var(--accent);outline-offset:2px}
.sm-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sm-legend{grid-column:2;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sm-key{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.sm-key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sm-key i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sm-key i.good{background:#bfe0cc}.sm-key i.some{background:#efd29a}.sm-key i.high{background:#eeb3ad}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media (max-width:1100px){.workspace{grid-template-columns:1fr}}
.stagecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.stagebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seatnote{margin-left:auto}
.stagecol .stagebox{padding:24px}
.stagecol .cap{font-size:13px;color:var(--muted)}
.film{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.film .thumb{padding:4px}
.film .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.film .meta b{font:600 12px var(--mono)}
.pin{position:absolute;transform:translate(-130%,-10%);width:22px;height:22px;border-radius:50%;border:2px solid #fff;color:#fff;font:600 11px var(--sans);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(21,26,34,.3);transition:transform 120ms ease-out}
.pin.high{background:var(--high)}.pin.some{background:var(--some)}.pin.minor{background:var(--faint)}
.pin.on{transform:translate(-130%,-10%) scale(1.2);outline:2px solid var(--accent);outline-offset:1px}
.pin:active{transform:translate(-130%,-10%) scale(.95)}
.notes{display:flex;flex-direction:column;min-width:0}
.flist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.flist .finding{flex-direction:row;gap:12px;border-left:0;border-radius:var(--r);padding:12px 10px}
.flist .num{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font:600 11px var(--sans);display:flex;align-items:center;justify-content:center;margin-top:1px}
.flist .num.high{background:var(--high)}.flist .num.some{background:var(--some)}.flist .num.minor{background:var(--faint)}
.fbody{display:flex;flex-direction:column;gap:4px;min-width:0}

/* findings panel */
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.panel-head h2 b{font-family:var(--mono);margin-right:8px}
.slidecats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.slidecats b{font-family:var(--mono);font-weight:600}
.group{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.group h3{font-size:13px;font-weight:600;margin:0 0 4px;color:var(--ink)}
.group h3 span{color:var(--faint);font-weight:400;margin-left:4px}
.finding{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-left:3px solid var(--line);border-radius:0 var(--r) var(--r) 0;cursor:pointer}
.finding:hover{background:var(--panel)}
.finding.high{border-left-color:var(--high)}.finding.some{border-left-color:var(--some)}.finding.minor{border-left-color:var(--line)}
.finding.sel{background:var(--accent-soft)}
.finding:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.finding .t{font-weight:500}
.finding p{margin:0;font-size:13px;color:var(--muted);max-width:60ch}
.finding .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.who{font-size:12px;color:var(--faint)}
.allclear{padding:16px 0;color:var(--good);font-weight:500}

/* setup */
.intake{display:flex;flex-direction:column;gap:28px;max-width:1040px}
.intake .q{display:flex;flex-direction:column;gap:10px}
.intake .q label.l,.intake .q h2{font-weight:600;font-size:16px}
.intake .ant-radio-group{display:flex;flex-wrap:wrap;gap:6px 0}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.profile{border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--panel);transition:border-color .15s,background .15s}
.profile:hover{border-color:#c9cfd9}
.profile b{font-weight:600;font-size:15px}
.profile span{font-size:13px;color:var(--muted)}
.profile.on{border-color:var(--accent);background:var(--accent-soft)}
.profile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.profile svg{margin-bottom:8px}
.actions{display:flex;justify-content:flex-start;gap:12px;padding-top:8px}
.roomviz.small{display:flex;justify-content:center;width:100%}

/* upload */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:24px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero .lead{font-size:16px;color:var(--muted);max-width:46ch;margin:12px 0 24px}
.sample{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.foot{font-size:12px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.hlbox{position:absolute;border:2px solid var(--accent);border-radius:4px;background:rgba(35,70,200,.08);pointer-events:none}
.flist .quote{font-size:12px;color:var(--ink);background:var(--sunk);border-radius:6px;padding:4px 8px;margin-top:2px}
.tabs button:disabled{color:var(--line);cursor:default}
.film img{display:block;border-radius:2px;box-shadow:0 1px 2px rgba(21,26,34,.12)}
.panel-head{align-items:baseline}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Machado 2009 deuteranopia, severity 1.0, applied in linear RGB -->
  <filter id="f-deut" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/></filter>
  <!-- Aging lens: blue absorbed, contrast reduced -->
  <filter id="f-old" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.92 0 0 0 0.03  0 0.88 0 0 0.03  0 0 0.58 0 0.02  0 0 0 1 0"/></filter>
</svg>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.21.6/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="app.js?v=003a8f0b22"></script>
</body>
</html>
