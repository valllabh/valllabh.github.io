<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vallabh Joshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #141414;
    }
    .profile {
      text-align: center;
      padding: 2rem;
    }
    .profile h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .profile p {
      color: #666;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-decoration: none;
      color: #141414;
      font-size: 0.9375rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .links a:hover {
      background: #f0f0f0;
      border-color: #bbb;
    }
    .links a i {
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <div class="profile">
    <h1>Vallabh Joshi</h1>
    <p>VJ</p>
    <div class="links">
      <a href="https://linkedin.com/in/valllabh" target="_blank" rel="noopener">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>
      <a href="https://github.com/valllabh" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub
      </a>
    </div>
  </div>
</body>
</html>
